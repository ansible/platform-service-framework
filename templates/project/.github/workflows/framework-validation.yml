---
name: Framework Validation
on:
  pull_request:
  push:
    branches:
      - devel
      - main
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7
      - name: Validate framework
        run: |
          BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          # Framework always lives in ansible/platform-service-framework regardless of which org
          # is consuming it. Fall back to devel if the branch doesn't exist in the framework repo.
          if git ls-remote --exit-code https://github.com/ansible/platform-service-framework.git "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            REF="${BRANCH}"
          else
            REF="devel"
          fi
          uvx --refresh git+https://github.com/ansible/platform-service-framework@${REF} validate