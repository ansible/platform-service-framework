---
name: Framework Validation
on:
  pull_request:
  push:
    branches:
      - devel
      - main
      - 'stable**'
      - 'release**'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7
      - name: Validate framework
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.event.pull_request.base.ref || github.ref_name }}"
          ORG="${{ github.event.pull_request.base.repo.owner.login || github.repository_owner }}"
          BASE_URL="https://x-access-token:${GH_TOKEN}@github.com/${ORG}/platform-service-framework"
          if git ls-remote --exit-code "${BASE_URL}.git" "refs/heads/${BRANCH}" > /dev/null 2>&1; then
            REF="${BRANCH}"
          else
            REF="devel"
          fi
          FRAMEWORK_DIR=$(mktemp -d)
          git clone --depth 1 --branch "${REF}" "${BASE_URL}.git" "${FRAMEWORK_DIR}"
          uvx --from "${FRAMEWORK_DIR}" platform-service-framework validate