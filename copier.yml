_subdirectory: "{{template}}"

template:
  choices:
    - templates/project
    - templates/app
    - templates/core

project_name:
  type: str

src_branch:
  type: str
  default: "main"

app_name:
  type: str
  default: ""

service_type:
  type: str
  default: "{{ project_name }}"
  when: "{{ app_name == 'core' }}"

apps:
  default:
    - api
